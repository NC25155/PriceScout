name: Daily Price History

on:
  schedule:
    # Daily at 06:15 Bahrain time (03:15 UTC)
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-price-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Collect public catalogue prices
        run: python -m scrapers.daily_history
      - name: Commit daily observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pricescout_history.csv
          if git diff --cached --quiet; then
            echo "No new observations to commit."
          else
            git commit -m "Update daily public price history"
            git push
          fi
